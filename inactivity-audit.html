rder-color:var(--mint)}.field input[type=text]{width:min(100%,310px)}.field input[type=number]{width:100px}.field textarea{width:100%;min-height:190px;font-size:12px;line-height:1.55;font-family:ui-monospace,Consolas,monospace}.field.grow{flex:1;min-width:260px}.hr{border:0;border-top:1px solid var(--border);margin:19px 0}.reviewList{display:grid;gap:9px}.reviewItem{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;border:1px solid #41597679;background:#12243a8c;padding:13px 14px;border-radius:12px}.reviewItem .name{font-weight:850;font-size:13px}.reviewItem .detail{color:#b1c3d5;font-size:12px;margin-top:5px;line-height:1.5}.reviewItem select{background:#0e2032;color:#eaf4ff;border:1px solid #587087;border-radius:9px;padding:9px 10px;min-width:170px;max-width:200px}.reviewTag{display:inline-block;margin-right:8px;color:#f9d99b;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.5px}.footer{color:#8396ab;text-align:center;font-size:11px;padding:14px 0 22px}.progress{height:5px;border-radius:20px;background:#20344b;overflow:hidden;margin-top:12px}.progress div{height:100%;background:linear-gradient(90deg,#5fbbdf,#66e1be);transition:width .2s}.empty{padding:24px;border:1px dashed #52718b;border-radius:12px;text-align:center;color:#b4c8d9;line-height:1.6;font-size:13px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.ruleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rule{border:1px solid var(--border);background:#13283a;border-radius:12px;padding:16px}.rule strong{display:block;margin-bottom:6px}.rule p{font-size:12px;color:#b4c5d7;line-height:1.5;margin:0}.guide{font-size:12px;line-height:1.8;color:#c5d5e5}.guide strong{color:#f1f8ff}.nowrap{white-space:nowrap}.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:11px}.statusline{color:#c1d1e1;font-size:12px;line-height:1.7;margin-top:12px;min-height:20px}.small{font-size:11px;color:var(--muted)}@med <body><div class="app">
<header class="top"><div class="brand"><div class="mark">TnT</div><div><div class="eyebrow">Dynasty league / commissioner tools</div><h1>Inactivity Audit</h1><div class="sub">2026 season · lineup integrity</div></div></div><div id="connection" class="pill"><span class="dot"></span><span>Ready to connect</span></div></header>
<div class="layout"><nav class="side" id="side"><button class="nav on" data-tab="overview">Season overview</button><button class="nav" data-tab="review">Review flagged starts</button><button class="nav" data-tab="data">Connect & import</button><button class="nav" data-tab="rules">Rule settings</button><div class="sideNote">Read-only Sleeper connection. Audits start-of-game lineup choices, not total points or player performance.</div></nav><main class="content" id="content"></main></div>
<footer class="footer">TnT Dynasty · Independent commissioner dashboard · Not affiliated with Sleeper</footer>
</div>
<script>
(function(){
"use strict";
var API="https://api.sleeper.app/v1";
var BYES={5:["CAR","KC"],6:["CIN","DET","MIA","MIN"],7:["BUF","JAX","LAC","WAS"],8:["HOU","NO","NYG","SF"],9:["PIT","TEN"],10:["CHI","DEN","PHI","TB"],11:["ATL","CLE","GB","LAR","NE","SEA"],13:["BAL","IND","LV","NYJ"],14:["ARI","DAL"]};
var KEY="tnt-audit-v4";
var DEFAULT={leagueId:"1312095646181765120",season:"2026",maxWeek:8,autoWeek:true,lastAttemptAt:null,league:null,users:[],rosters:[],players:{},weeks:{},decisions:{},notes:{},injuries:[],injuryUpdatedAt:null,updatedAt:null};
var state;
try{state=Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){state=Object.assign({},DEFAULT);}
var view={tab:"overview",team:"all",week:"all",show:"unresolved",loading:false,message:"",errors:[],progress:0,connected:false};
var content=document.getElementById("content");
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){notice("Storage is full. Export your audit to preserve reviews.");}}
function esc(s){return String(s===null||s===undefined?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]});}
function n(x){return Number(x)||0;}
function toId(x){return String(x===undefined||x===null?"":x);}
function notice(s){view.message=s;var el=document.getElementById("statusline");if(el)el.textContent=s;}
function weeksLoaded(){return Object.keys(state.weeks).filter(function(w){return +w<=+state.maxWeek&&Array.isArray(state.weeks[w])&&state.weeks[w].length;}).map(Number).sort(function(a,b){return a-b;});}
function player(id){return state.players[toId(id)]||{};}
function pn(id){var p=player(id);return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||("Player #"+toId(id));}
function ppos(id){var p=player(id);return p.fantasy_positions||[p.position].filter(Boolean);}
function pteam(id){return player(id).team||"";}
function userForRoster(r){var row=(state.rosters||[]).find(function(x){return +x.roster_id===+r;});var uid=toId(row&&row.owner_id);return (state.users||[]).find(function(u){return toId(u.user_id)===uid;})||{};}
function teamName(r){var row=(state.rosters||[]).find(function(x){return +x.roster_id===+r;})||{};var u=userForRoster(r);return row.metadata&&row.metadata.team_name||u.metadata&&u.metadata.team_name||u.display_name||("Roster "+r);}
function ownerName(r){var u=userForRoster(r);return u.display_name&&u.display_name!==teamName(r)?u.display_name:"Roster "+r;}
function rosterIds(){var a=new Set();(state.rosters||[]).forEach(function(x){a.add(+x.roster_id)});Object.keys(state.weeks).forEach(function(w){(state.weeks[w]||[]).forEach(function(x){a.add(+x.roster_id)})});if(!a.size)for(var k=1;k<=12;k++)a.add(k);return Array.from(a).sort(function(a,b){return a-b;});}
function slots(){return state.league&&Array.isArray(state.league.roster_positions)?state.league.roster_positions.filter(function(s){return !["BN","IR","TAXI"].includes(s)}):["QB","RB","RB","WR","WR","TE","FLEX","FLEX"];}
function eligible(pos,slot){if(!slot)return false;if(slot==="SUPER_FLEX")return ["QB","RB","WR","TE"].some(function(x){return pos.includes(x)});if(slot==="FLEX")return ["RB","WR","TE"].some(function(x){return pos.includes(x)});if(slot==="REC_FLEX")return ["WR","TE"].some(function(x){return pos.includes(x)});return pos.includes(slot);}

var INJURY_URL="https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_";
function normName(v){return String(v||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/\b(jr|sr|ii|iii|iv)\b\.?/g,"").replace(/[^a-z0-9]/g,"");}
function injuryLookup(week,id){
 var p=player(id),name=normName(pn(id)),gsis=toId(p.gsis_id),team=String(pteam(id)||"").toUpperCase();
 if(!name||name.indexOf("player")===0)return null;
 var list=(state.injuries||[]).filter(function(x){return +x.week===+week&&String(x.season)===String(state.season)&&((gsis&&gsis!=="undefined"&&gsis===toId(x.gsis_id))||normName(x.full_name)===name);});
 if(!list.length)return null;
 var matched=list.filter(function(x){return String(x.team||"").toUpperCase()===team;});
 if(matched.length)list=matched;
 else if(new Set(list.map(function(x){return x.team;})).size>1)return null;
 return list.reduce(function(a,b){var rank=function(x){return /^out$/i.test(x.report_status)?3:/^doubtful$/i.test(x.report_status)?2:/^questionable$/i.test(x.report_status)?1:0;};return rank(b)>rank(a)?b:a;});
}
function parseCsv(text){
 text=String(text||"").replace(/^\uFEFF/,"");
 var rows=[],row=[],buf="",quoted=false;
 for(var i=0;i<text.length;i++){var c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){buf+='"';i++;}else quoted=!quoted;}else if(c===","&&!quoted){row.push(buf);buf="";}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&text[i+1]==="\n")i++;row.push(buf);buf="";if(row.some(function(v){return v!=="";}))rows.push(row);row=[];}else buf+=c;}
 if(quoted)throw Error("CSV ended inside a quoted field");
 if(buf||row.length){row.push(buf);rows.push(row);}
 var names=(rows.shift()||[]).map(function(h){return h.trim().toLowerCase();});
 if(!["season","week","full_name","report_status"].every(function(k){return names.includes(k);})){throw Error("Not an nflverse injuries CSV");}
 return rows.map(function(vals){var rec={};names.forEach(function(k,i){rec[k]=vals[i]||"";});return rec;}).filter(function(r){return r.season&&r.week&&r.full_name;});
}
async function fetchInjuryCsv(){
 var ctrl=new AbortController(),timer=setTimeout(function(){ctrl.abort();},18000);
 try{
  var response=await fetch(INJURY_URL+encodeURIComponent(state.season)+".csv",{signal:ctrl.signal,cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  var rows=parseCsv(await response.text()).filter(function(x){return String(x.season)===String(state.season)&&(!x.season_type||x.season_type==="REG");});
  if(!rows.length)throw Error("No matching season injury data");
  state.injuries=rows;state.injuryUpdatedAt=new Date().toISOString();save();return rows.length;
 }finally{clearTimeout(timer);}
}
function flagsFor(week,roster){
var data=(state.weeks[week]||[]).find(function(x){return +x.roster_id===+roster});if(!data)return null;
var starters=data.starters||[];var bench=(data.players||[]).filter(function(id){return !starters.map(toId).includes(toId(id));});
var result=[];var positions=slots();
starters.forEach(function(id,i){
var empty=!id||toId(id)==="0";
var pts=Array.isArray(data.starters_points)?n(data.starters_points[i]):n((data.players_points||{})[id]);
var key=[week,roster,i,toId(id)].join(":");var old=state.decisions[key]||"";
var bye=String(state.season)==="2026"&&(BYES[week]||[]).includes(pteam(id));
var report=empty?null:injuryLookup(week,id);
var reportedOut=report&&/^out$/i.test(String(report.report_status||"").trim());
if(!empty&&pts!==0&&!bye&&!reportedOut&&!old)return;
if(!empty&&!bye&&!reportedOut&&pts!==0&&old!=="count")return;
var slot=positions[i]||"FLEX";
var candidates=bench.filter(function(x){return eligible(ppos(x),slot)&&n((data.players_points||{})[x])>0;});
var reason=empty?"EMPTY":bye?"BYE":reportedOut?"OUT":"ZERO";
var automatic=bye&&candidates.length>0;
var counted=old==="count"||(automatic&&old!=="excuse"&&old!=="review");
var pending=!counted&&old!=="excuse";
result.push({week:+week,roster:+roster,slot:slot,index:i,id:toId(id),name:empty?"Empty starting slot":pn(id),pts:pts,reason:reason,automatic:automatic,decision:old,counted:counted,pending:pending,candidates:candidates,key:key,team:pteam(id),report:report});
});
return result;
}
function dataFor(roster,week){var f=flagsFor(week,roster);if(f===null)return {status:"missing",flags:[],count:0,review:0};var count=f.filter(function(x){return x.counted}).length,review=f.filter(function(x){return x.pending}).length;return {status:count?"bad":review?"review":"good",flags:f,count:count,review:review};}
function totals(roster){var violation=0,review=0,players=0;weeksLoaded().forEach(function(w){var d=dataFor(roster,w);if(d.count){violation++;players+=d.count;}if(d.review)review++;});return {violation:violation,review:review,players:players,penalty:Math.max(0,violation-2),warning:violation>=2};}
function allStats(){var rs=rosterIds(), warnings=0,penalties=0,needs=0,violWeeks=0;rs.forEach(function(r){var t=totals(r);if(t.warning)warnings++;if(t.penalty)penalties++;needs+=t.review;violWeeks+=t.violation;});return {teams:rs.length,warnings:warnings,penalties:penalties,needs:needs,violWeeks:violWeeks};}
function title(t,h,d){return '<div class="hero"><div><div class="eyebrow">'+t+'</div><h2>'+h+'</h2><p>'+d+'</p></div></div>';}
function stat(label,val,foot,cls){return '<div class="stat"><div class="statLabel">'+label+'</div><div class="statNum '+(cls||'')+'">'+val+'</div><div class="statFoot">'+foot+'</div></div>';}
function renderSide(){document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.toggle("on",b.dataset.tab===view.tab);});var cnt=weeksLoaded().length;var c=document.getElementById("connection");c.innerHTML='<span class="dot '+(cnt?"ok":"warn")+'"></span><span>'+(cnt?cnt+" week"+(cnt===1?"":"s")+" loaded":"No weeks loaded")+"</span>";}
function overview(){
var ids=rosterIds();var wks=Array.from({length:state.maxWeek},function(_,i){return i+1;});var stats=allStats();var complete=weeksLoaded().length;
var out=title("League-wide monitoring","Season-to-date overview","Inactive weeks are counted once per matchup, not once per player. Only confirmed violations affect the penalty projection.");
out+='<div class="actions" style="margin-bottom:17px"><button class="btn primary" data-act="sync">'+(view.loading?"Connecting…":"Sync Sleeper")+'</button><button class="btn" data-tab="review">Review flags</button><button class="btn" data-act="csv">Export report</button></div>';
out+='<div class="stats">'+stat("Weeks loaded",complete+"/"+state.maxWeek,"Regular-season weeks scanned","blue")+stat("Violation weeks",stats.violWeeks,"Confirmed or automatic bye violations","rose")+stat("Formal warnings",stats.warnings,"2 or more violating weeks","amber")+stat("Lottery penalties",stats.penalties,"Teams with 3+ violating weeks","green")+'</div>';
if(!complete)out+='<div class="callout warn"><strong>No matchup data loaded.</strong> Click Sync Sleeper to collect all '+state.maxWeek+' weeks. If the API is blocked, open Connect & import and paste weekly matchup JSON directly.</div>';
else if(complete<+state.maxWeek)out+='<div class="callout warn"><strong>Partial season:</strong> '+complete+' of '+state.maxWeek+' weeks loaded. Missing weeks are not scored as clean.</div>';
if(stats.needs)out+='<div class="callout"><strong>'+stats.needs+' team-weeks need review.</strong> A zero-point starter may have played. It is not automatically a violation. Click Review flags to approve or excuse each start.</div>';
out+='<div class="section"><div class="sectionTitle"><h3>Team-by-team activity</h3><span class="hint">Tap a team to review its players</span></div><div class="scroll"><table class="matrix"><thead><tr><th>Franchise</th>';
wks.forEach(function(w){out+='<th>W'+w+'</th>';});
out+='<th>Violations</th><th>Review</th><th>Rule result</th></tr></thead><tbody>';
ids.forEach(function(r){var t=totals(r);out+='<tr><td><button class="teamLink" data-act="team" data-id="'+r+'">'+esc(teamName(r))+'<span class="secondary">'+esc(ownerName(r))+'</span></button></td>';
wks.forEach(function(w){var d=dataFor(r,w);var text=d.status==="bad"?"!":d.status==="review"?"?":d.status==="good"?"✓":"–";out+='<td><button class="cell '+d.status+'" data-act="cell" data-id="'+r+'" data-week="'+w+'" title="Week '+w+'">'+text+'</button></td>';});
var label=t.penalty?"−"+t.penalty+" "+(t.penalty===1?"entry":"entries"):t.warning?"Formal warning":"No penalty";
out+='<td><strong class="'+(t.violation?"rose":"")+'">'+t.violation+'</strong></td><td class="'+(t.review?"amber":"muted")+'">'+t.review+'</td><td><span class="miniBadge '+(t.penalty?"bad":t.warning?"warn":"")+'">'+label+'</span></td></tr>';});
out+='</tbody></table></div><div class="legend"><span><i></i>No issues found</span><span><i class="ly"></i>Needs review</span><span><i class="lr"></i>Counted violation</span><span><i class="ln"></i>Not loaded</span></div><p class="footnote">An apparently clean week can still contain a historical OUT/IR/SUS start that Sleeper&#39;s matchup data alone cannot identify. Confirm game-time statuses for commissioner decisions. Counts do not establish intent.</p></div>';
out+='<div class="section"><div class="sectionTitle"><h3>How the rule is applied</h3></div><div class="ruleGrid"><div class="rule"><strong>2 weeks</strong><p>Formal commissioner warning.</p></div><div class="rule"><strong>3 weeks</strong><p>First potential rookie-lottery entry deduction.</p></div><div class="rule"><strong>4+ weeks</strong><p>One additional entry deducted for each further week.</p></div></div><p class="footnote">Lottery entry deductions are provisional until ratified and only affect teams eligible for the lottery. Teams cannot fall below one entry.</p></div>';
return out;
}
function review(){
var ids=rosterIds();var wks=weeksLoaded();var filtered=[];
wks.forEach(function(w){ids.forEach(function(r){var d=dataFor(r,w);d.flags.forEach(function(f){if(view.week!=="all"&&+view.week!==w)return;if(view.team!=="all"&&+view.team!==r)return;if(view.show==="unresolved"&&!f.pending)return;if(view.show==="counted"&&!f.counted)return;filtered.push(f);});});});
filtered.sort(function(a,b){return b.week-a.week||a.roster-b.roster;});
var out=title("Commissioner review","Flagged starts","Each flag displays a historical NFL injury designation when available. Confirm that the player was ruled out before kickoff and that a usable replacement was available.");
out+='<div class="section"><div class="fields"><div class="field"><label>Manager</label><select data-change="team"><option value="all">All teams</option>';
ids.forEach(function(r){out+='<option value="'+r+'" '+(String(view.team)===String(r)?"selected":"")+'>'+esc(teamName(r))+'</option>';});out+='</select></div><div class="field"><label>Week</label><select data-change="week"><option value="all">All weeks</option>';
wks.forEach(function(w){out+='<option value="'+w+'" '+(String(view.week)===String(w)?"selected":"")+'>Week '+w+'</option>';});out+='</select></div><div class="field"><label>Display</label><select data-change="show"><option value="unresolved" '+(view.show==="unresolved"?"selected":"")+'>Needs review</option><option value="counted" '+(view.show==="counted"?"selected":"")+'>Counted violations</option><option value="all" '+(view.show==="all"?"selected":"")+'>All flags</option></select></div></div></div>';
out+='<div class="callout">Use <strong>Count violation</strong> only if the player was already ruled out before kickoff and an eligible replacement was available. <strong>Excuse</strong> late scratches, active players who scored zero, or cases without a usable substitute. A bye-week starter with a scoring eligible bench alternative is automatically counted until excused.</div>';
out+='<div class="section"><div class="sectionTitle"><h3>Lineup flags</h3><span class="hint">'+filtered.length+' player flags shown</span></div>';
if(!filtered.length)out+='<div class="empty">'+(wks.length?"No flags match this filter. Try All flags or another week.":"Sync or import matchup data to populate this audit.")+'</div>';
else out+='<div class="reviewList">'+filtered.map(function(f){
var sub=f.candidates.length?f.candidates.slice(0,4).map(function(x){return pn(x)+" ("+n((state.weeks[f.week]||[]).find(function(y){return +y.roster_id===f.roster;}).players_points[x]).toFixed(1)+" pts)";}).join(", "):"No scoring bench replacement identified";
var reason=f.reason==="BYE"?"Bye-week starter":f.reason==="EMPTY"?"Empty lineup slot":f.reason==="OUT"?"Reported OUT":"Zero points — verify status";
var rep=f.report;var status=rep?rep.report_status||"No game designation":"No matching report";
var statusBlock='<div class="detail"><strong>Week '+f.week+' designation:</strong> '+esc(f.reason==="BYE"?"BYE":status)+(rep&&rep.report_primary_injury?' · '+esc(rep.report_primary_injury):"")+(rep&&rep.practice_status?' · Practice: '+esc(rep.practice_status):"")+'</div>';
return '<div class="reviewItem"><div><div><span class="reviewTag">'+esc(reason)+'</span><span class="small">Week '+f.week+' · '+esc(teamName(f.roster))+' · '+esc(f.slot)+'</span></div><div class="name">'+esc(f.name)+'</div><div class="detail">NFL: '+esc(f.team||"Unknown")+' · '+f.pts+' pts · Bench option: '+esc(sub)+'</div>'+statusBlock+'</div><div><select data-decision="'+esc(f.key)+'" aria-label="Review '+esc(f.name)+'"><option value="" '+(!f.decision?"selected":"")+'> '+(f.automatic?"Auto-counted bye":"Needs review")+' </option><option value="count" '+(f.decision==="count"?"selected":"")+'>Count violation</option><option value="excuse" '+(f.decision==="excuse"?"selected":"")+'>Excuse / active</option><option value="review" '+(f.decision==="review"?"selected":"")+'>Keep for review</option></select></div></div>';
}).join("")+'</div>';
out+='<p class="footnote">Each team gets at most one violation per week regardless of how many player flags are counted. Decisions are saved locally in this browser.</p></div>';return out;
}
function data(){
var out=title("Data management","Connect & import","The app reads Sleeper's public, read-only API directly from your browser. You can also paste matchup JSON when a network request fails.");
out+='<div class="section"><div class="sectionTitle"><h3>Connect to your league</h3><span class="hint">No API key required</span></div><div class="fields"><div class="field grow"><label>Sleeper League ID</label><input id="leagueInput" type="text" inputmode="numeric" value="'+esc(state.leagueId)+'"></div><div class="field"><label>Season</label><input id="seasonInput" type="number" min="2018" max="2035" value="'+esc(state.season)+'"></div><div class="field"><label>Through week (completed)</label><input id="throughInput" type="number" min="1" max="18" value="'+n(state.maxWeek)+'" '+(state.autoWeek?"disabled":"")+'></div><button class="btn primary" data-act="sync">Sync season to date</button></div><div class="fields" style="margin-top:13px"><label class="pill"><input id="autoWeek" type="checkbox" '+(state.autoWeek?"checked":"")+' style="accent-color:var(--mint)"> Automatically detect completed NFL weeks</label></div>';
out+='<div class="statusline" id="statusline">'+esc(view.message||("Loaded: "+weeksLoaded().join(", ")+(state.updatedAt?" · Last sync "+new Date(state.updatedAt).toLocaleString():"")))+'</div><div class="progress"><div style="width:'+view.progress+'%"></div></div>';
if(view.errors.length)out+='<p class="footnote rose">'+view.errors.map(esc).join(" · ")+'</p>';
out+='</div><div class="section"><div class="sectionTitle"><h3>Historical injury designations</h3><span class="hint">NFL weekly injury reports · nflverse</span></div><p class="small">Cross-check players for the given week: OUT, Doubtful, Questionable, or practice status. <a href="'+INJURY_URL+esc(state.season)+'.csv" target="_blank" rel="noopener">Download '+esc(state.season)+' source CSV</a>.</p><div class="row"><span class="small"><strong>'+((state.injuries||[]).length).toLocaleString()+'</strong> report rows loaded'+(state.injuryUpdatedAt?' · '+new Date(state.injuryUpdatedAt).toLocaleString():'')+'</span><div class="actions"><button class="btn" data-act="injuries">Refresh injury reports</button><label class="btn" style="cursor:pointer">Import source CSV<input id="injuryUpload" type="file" accept=".csv,text/csv" style="display:none"></label></div></div><p class="footnote">If automatic retrieval is blocked, download the linked CSV and import it. This dataset does not comprehensively track IR, suspensions, or last-minute game-day inactives. An unmatched report is not proof of eligibility.</p></div><div class="section"><div class="sectionTitle"><h3>Paste a weekly matchup response</h3><span class="hint">Fallback when API calls are unavailable</span></div><p class="small">Open the Sleeper matchup endpoint in Safari, copy the full JSON array, paste it below, select the week, and import. Accepts an array of 12 matchups or a saved audit export.</p><div class="fields"><div class="field"><label>Week for JSON</label><select id="pasteWeek">';
for(var w=1;w<=state.maxWeek;w++)out+='<option value="'+w+'" '+(w===state.maxWeek?"selected":"")+'>Week '+w+'</option>';
out+='</select></div><button class="btn" data-act="paste">Import pasted JSON</button><button class="btn" data-act="download">Export backup JSON</button><label class="btn" style="cursor:pointer">Import backup file<input id="fileUpload" type="file" accept=".json,application/json" style="display:none"></label></div><div class="field grow" style="margin-top:15px"><textarea id="pasteInput" placeholder=\'[{"roster_id":1,"starters":["..."],"players":["..."],"players_points":{"...":0}}, ...]\'></textarea></div><p class="footnote">Sleeper matchup endpoint: <a target="_blank" rel="noopener" href="'+API+'/league/'+esc(state.leagueId)+'/matchups/8">Open Week 8 JSON</a>. Change the final week number in the address for other weeks.</p></div>';
out+='<div class="section"><div class="sectionTitle"><h3>Local data and reports</h3></div><div class="fields"><button class="btn" data-act="csv">Download CSV report</button><button class="btn" data-act="download">Download backup JSON</button><button class="btn" data-act="reset">Erase saved audit data</button></div><p class="footnote">Matchups and your review decisions are stored only in this browser. They do not edit Sleeper or submit anything to your league.</p></div>';
return out;
}
function rules(){
var out=title("Policy framework","Inactivity rule","The audit is an evidence-gathering tool. The commissioners should apply the league's adopted rules and review exceptional circumstances.");
out+='<div class="section"><div class="sectionTitle"><h3>Proposed Article X · Section 10.02</h3></div><div class="ruleGrid"><div class="rule"><strong>1 inactive week</strong><p>No penalty. Flag logged for the season.</p></div><div class="rule"><strong>2 inactive weeks</strong><p>Formal warning from the commissioners.</p></div><div class="rule"><strong>3+ inactive weeks</strong><p>One draft-lottery entry deducted beginning with week three, plus one per additional week.</p></div></div><hr class="hr"><div class="guide"><strong>What counts?</strong> Starting a player designated OUT, IR, SUS, BYE, or otherwise officially unavailable before kickoff, where a valid substitute was on the roster.<br><strong>How is it counted?</strong> One violation for the team per NFL week, even when multiple starters are unavailable. Violations are cumulative through the season and reset the following season.<br><strong>Late injury designations:</strong> Review context before assigning a violation. A genuine last-minute scratch can be excused; availability at kickoff alone does not establish negligence.<br><strong>Lottery:</strong> Counted violations of 3, 4 and 5 weeks imply potential deductions of 1, 2 and 3 entries, respectively. The lottery has a one-entry floor. A draft penalty requires a league-approved rule.<br><strong>Owner removal:</strong> Existing commissioner discretion under the current rulebook is separate from the proposed lottery sanctions.</div></div><div class="callout warn">Retroactive OUT/IR/SUS status and the exact announcement time are <strong>not</strong> in Sleeper&#39;s historical matchup response. The dashboard intentionally does not invent that information or classify zero points as a confirmed absence.</div>';
return out;
}
function render(){renderSide();content.innerHTML=view.tab==="review"?review():view.tab==="data"?data():view.tab==="rules"?rules():overview();}
function download(name,content,type){var blob=new Blob([content],{type:type});var url=URL.createObjectURL(blob);var link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);}
function csv(){var rows=[["roster_id","team","owner","weeks_loaded","confirmed_violation_weeks","pending_review_weeks","formal_warning","potential_lottery_entries_lost","violating_weeks","review_weeks"]];rosterIds().forEach(function(r){var t=totals(r),bad=[],pending=[];weeksLoaded().forEach(function(w){var a=dataFor(r,w);if(a.count)bad.push(w);if(a.review)pending.push(w);});rows.push([r,teamName(r),ownerName(r),weeksLoaded().length,t.violation,t.review,t.warning?"Yes":"No",t.penalty,bad.join(";"),pending.join(";")]);});var s=rows.map(function(a){return a.map(function(v){var x=String(v);return /[,"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(",")}).join("\n");download("tnt-inactivity-summary-"+state.season+".csv",s,"text/csv");}
function acceptWeek(week,json){if(!Array.isArray(json)||!json.length||!json.every(function(r){return r&&typeof r.roster_id!=="undefined"&&Array.isArray(r.starters);})){throw Error("Expected an array of roster matchup objects containing roster_id and starters.");}state.weeks[week]=json;state.updatedAt=new Date().toISOString();save();}
function importJson(obj,week){if(Array.isArray(obj)){acceptWeek(week,obj);return "Imported "+obj.length+" rosters for Week "+week;}if(obj&&Array.isArray(obj.matchups)){acceptWeek(+obj.week||week,obj.matchups);return "Imported Week "+(+obj.week||week);}if(obj&&obj.weeks&&typeof obj.weeks==="object"){var weeks=Object.keys(obj.weeks);weeks.forEach(function(w){if(Array.isArray(obj.weeks[w]))acceptWeek(w,obj.weeks[w]);});if(obj.players&&typeof obj.players==="object")state.players=Object.assign({},state.players,obj.players);if(Array.isArray(obj.users))state.users=obj.users;if(Array.isArray(obj.rosters))state.rosters=obj.rosters;if(obj.league)state.league=obj.league;if(obj.decisions)state.decisions=Object.assign({},state.decisions,obj.decisions);state.updatedAt=new Date().toISOString();save();return "Imported "+weeks.length+" weeks and any included metadata.";}if(obj&&obj.players&&typeof obj.players==="object"){state.players=Object.assign({},state.players,obj.players);save();return "Imported player metadata.";}throw Error("Unrecognized JSON. Paste Sleeper's weekly matchup array, or an exported audit backup.");}
async function fetchJson(url){var controller=new AbortController();var timer=setTimeout(function(){controller.abort()},16000);try{var r=await fetch(url,{signal:controller.signal,cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return await r.json();}finally{clearTimeout(timer);}}
async function sync(){
if(view.loading)return;
var lid=document.getElementById("leagueInput");if(lid)state.leagueId=lid.value.trim();
var season=document.getElementById("seasonInput");if(season)state.season=season.value.trim();
var auto=document.getElementById("autoWeek");if(auto)state.autoWeek=auto.checked;
var through=document.getElementById("throughInput");if(through&&!state.autoWeek)state.maxWeek=Math.max(1,Math.min(18,+through.value||8));
if(!/^\d{10,}$/.test(state.leagueId)){notice("Enter a valid numeric Sleeper League ID.");return;}
view.loading=true;view.errors=[];view.progress=2;state.lastAttemptAt=new Date().toISOString();save();render();view.message="Connecting to Sleeper…";notice(view.message);
if(state.autoWeek){try{var nfl=await fetchJson(API+"/state/nfl");var leg=Number(nfl.leg||nfl.week||0);if(String(nfl.season)===String(state.season)&&leg>0){state.maxWeek=nfl.season_type==="regular"?Math.max(1,Math.min(14,leg-1)):14;}else{view.errors.push("Could not verify current completed week; using Week "+state.maxWeek);}}catch(e){view.errors.push("Auto-week detection: "+e.message+"; using Week "+state.maxWeek);}render();}
var lid2=state.leagueId;var total=state.maxWeek+4;var done=0;
async function item(url,action,label){try{var data=await fetchJson(url);action(data);done++;view.progress=Math.round(done/total*100);notice("Loaded "+label+" · "+done+"/"+total+" requests");return true;}catch(e){done++;view.errors.push(label+": "+e.message);view.progress=Math.round(done/total*100);notice("Could not load "+label+" ("+e.message+")");return false;}}
var prefix=API+"/league/"+lid2;
await Promise.all([item(prefix,function(d){state.league=d;}, "league settings"),item(prefix+"/users",function(d){state.users=d;},"owners"),item(prefix+"/rosters",function(d){state.rosters=d;},"rosters")]);
var jobs=[];for(var w=1;w<=state.maxWeek;w++)(function(week){jobs.push(function(){return item(prefix+"/matchups/"+week,function(d){acceptWeek(week,d);},"Week "+week);});})(w);
var next=0;async function worker(){while(next<jobs.length){var i=next++;await jobs[i]();}}
await Promise.all([worker(),worker(),worker()]);
var knownIds=new Set();Object.keys(state.weeks).forEach(function(w){(state.weeks[w]||[]).forEach(function(x){(x.players||[]).forEach(function(id){knownIds.add(toId(id));});});});
await item(API+"/players/nfl",function(d){var slim={};knownIds.forEach(function(id){if(d[id]){var p=d[id];slim[id]={full_name:p.full_name,first_name:p.first_name,last_name:p.last_name,position:p.position,fantasy_positions:p.fantasy_positions,team:p.team,espn_id:p.espn_id,gsis_id:p.gsis_id};}});state.players=Object.assign({},state.players,slim);},"NFL player metadata");
try{var reportCount=await fetchInjuryCsv();notice("Loaded "+reportCount+" nflverse report rows");}catch(e){view.errors.push("Historical injury reports: "+e.message+" (manual CSV import available)");}
state.updatedAt=new Date().toISOString();save();view.loading=false;view.progress=100;view.message=weeksLoaded().length+" of "+state.maxWeek+" weeks loaded"+(view.errors.length?" · "+view.errors.length+" request(s) failed":" · Successfully synced");render();
}
document.addEventListener("click",function(e){var btn=e.target.closest("[data-tab],[data-act]");if(!btn)return;if(btn.dataset.tab){view.tab=btn.dataset.tab;render();return;}var a=btn.dataset.act;
if(a==="sync"){sync();return;}
if(a==="injuries"){btn.disabled=true;btn.textContent="Loading reports…";fetchInjuryCsv().then(function(k){view.message="Loaded "+k+" injury reports";render();}).catch(function(e){view.message="Injury download failed: "+e.message+" — import the source CSV manually.";render();});return;}
if(a==="team"||a==="cell"){view.tab="review";view.team=btn.dataset.id||"all";view.week=btn.dataset.week||"all";view.show="all";render();return;}
if(a==="csv"){csv();return;}
if(a==="download"){download("tnt-audit-backup-"+state.season+".json",JSON.stringify(state,null,2),"application/json");return;}
if(a==="reset"){if(confirm("Delete cached matchup data and review decisions in this browser?")){state=Object.assign({},DEFAULT,{weeks:{},decisions:{},players:{},injuries:[],injuryUpdatedAt:null,users:[],rosters:[]});save();view.message="Local audit data erased.";render();}return;}
if(a==="paste"){var el=document.getElementById("pasteInput");var week=+document.getElementById("pasteWeek").value;try{var msg=importJson(JSON.parse(el.value),week);notice(msg);render();}catch(err){notice("Import error: "+err.message);}return;}
});
document.addEventListener("change",function(e){var t=e.target;
if(t.id==="autoWeek"){state.autoWeek=t.checked;save();render();return;}
if(t.dataset.decision!==undefined){if(t.value)state.decisions[t.dataset.decision]=t.value;else delete state.decisions[t.dataset.decision];save();render();return;}
if(t.dataset.change){view[t.dataset.change]=t.value;render();return;}
if(t.id==="injuryUpload"&&t.files&&t.files[0]){var ir=new FileReader();ir.onload=function(){try{var rows=parseCsv(ir.result).filter(function(r){return String(r.season)===String(state.season)&&(!r.season_type||r.season_type==="REG");});if(!rows.length)throw Error("No matching "+state.season+" report rows");state.injuries=rows;state.injuryUpdatedAt=new Date().toISOString();save();view.message="Imported "+rows.length+" injury reports";render();}catch(err){notice("CSV error: "+err.message);}};ir.readAsText(t.files[0]);return;}
if(t.id==="fileUpload"&&t.files[0]){var reader=new FileReader();reader.onload=function(){try{var x=JSON.parse(reader.result);var msg=importJson(x,state.maxWeek);view.message=msg;render();}catch(err){notice("File import error: "+err.message);}};reader.readAsText(t.files[0]);}
});
render();
if(state.autoWeek&&(!state.lastAttemptAt||Date.now()-Date.parse(state.lastAttemptAt)>6*60*60*1000)){sync();}
})();
</script>
</body></html>
