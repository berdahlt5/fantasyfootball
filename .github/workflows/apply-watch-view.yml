name: Apply watch view
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-view.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch schedule tool
        run: python scripts/patch-watch-view.py
      - name: Validate JavaScript and features
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('schedule-tool.html').read_text()
          for needle in ['watch-priority-v1','Best games to watch','Must Watch','crunchSignalsForGame','See players by league']:
              assert needle in s, needle
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('schedule-tool.html','utf8');
          const blocks=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          for (const code of blocks) new vm.Script(code);
          console.log(`Validated ${blocks.length} script blocks`);
          NODE
      - name: Commit watch view
        shell: bash
        run: |
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add schedule-tool.html
          git commit -m "Turn schedule tool into watch priority dashboard"
          git push
          git rm scripts/patch-watch-view.py .github/workflows/apply-watch-view.yml
          git commit -m "Remove one-time watch view patch files"
          git push
