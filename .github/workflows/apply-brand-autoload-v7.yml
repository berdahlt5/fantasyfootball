name: Apply Fantasy Assistant brand and autoload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-brand-autoload-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply branding and autoload
        run: python .github/scripts/brand_autoload_v7.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['home.html','index.html']:
              t=Path(name).read_text()
              assert 'if(els.username.value.trim()) await loadDashboard();' in t
              assert '>Refresh Owner Dashboard</button>' in t
              assert '<title>Fantasy Assistant · Owner Dashboard</title>' in t
          for name,page in {
            'schedule-tool.html':'Watch Planner',
            'team-rankings.html':'Rankings',
            'waiver-wire-agent.html':'Waivers',
            'lineup-assistant.html':'Lineup Check',
            'crunchtime.html':'Crunchtime',
          }.items():
              assert f'<title>Fantasy Assistant · {page}</title>' in Path(name).read_text()
          css=Path('app-shell.css').read_text()
          assert '/* fantasy-assistant-brand-v7 */' in css
          assert css.count('{') == css.count('}')
          print('validation passed')
          PY
          node --check app-shell.js
      - name: Commit changes and remove one-time patch files
        run: |
          rm -f .github/scripts/brand_autoload_v7.py .github/workflows/apply-brand-autoload-v7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Brand app as Fantasy Assistant and auto-load dashboard'
          git push
