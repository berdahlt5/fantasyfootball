name: Apply Crunchtime and schedule fixes
on:
  push:
    paths:
      - '.github/workflows/apply-crunchtime-schedule-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fantasy tools
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          schedule_path = Path('schedule-tool.html')
          s = schedule_path.read_text()

          s = replace_once(s,
          '    .player-leagues{color:var(--muted);font-size:.77rem;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.35}',
          '''    .player-leagues{color:var(--muted);font-size:.77rem;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.35;display:flex;align-items:center;gap:5px;flex-wrap:wrap}\n    .exposure-copy{margin-right:2px;color:var(--muted)}\n    .league-exposure-label{display:inline-flex;align-items:center;max-width:100%;padding:3px 7px;border:1px solid transparent;border-radius:999px;font-size:.68rem;font-weight:1000;line-height:1.2;overflow-wrap:anywhere}''',
          'league exposure CSS')

          s = replace_once(s,
          '    function renderLeagueFilters() {',
          '''    const LEAGUE_COLORS = [\n      { bg: "rgba(132,186,215,.92)", border: "rgba(132,186,215,.98)", text: "#2E2823" },\n      { bg: "rgba(219,255,214,.92)", border: "rgba(169,230,165,.98)", text: "#2E2823" },\n      { bg: "rgba(216,169,74,.92)", border: "rgba(216,169,74,.98)", text: "#2E2823" },\n      { bg: "rgba(231,128,128,.88)", border: "rgba(231,128,128,.96)", text: "#2E2823" },\n      { bg: "rgba(191,229,183,.92)", border: "rgba(191,229,183,.98)", text: "#2E2823" },\n      { bg: "rgba(180,164,220,.9)", border: "rgba(180,164,220,.98)", text: "#2E2823" },\n      { bg: "rgba(239,190,137,.9)", border: "rgba(239,190,137,.98)", text: "#2E2823" },\n      { bg: "rgba(150,214,204,.9)", border: "rgba(150,214,204,.98)", text: "#2E2823" }\n    ];\n\n    function leagueColorStyle(label) {\n      const key = String(label || "League").split(":")[0].trim();\n      let hash = 0;\n      for (let i = 0; i < key.length; i += 1) hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;\n      const color = LEAGUE_COLORS[Math.abs(hash) % LEAGUE_COLORS.length];\n      return `background:${color.bg};border-color:${color.border};color:${color.text}`;\n    }\n\n    function renderLeagueFilters() {''',
          'league color helper')

          s = replace_once(s,
          '        <label class="league-chip">',
          '        <label class="league-chip" style="${leagueColorStyle(league.name)}">',
          'league filter chip color')

          s = replace_once(s,
          '''              <div class="player-leagues">\n                ${player.count} exposure${player.count === 1 ? "" : "s"}:\n                ${escapeHtml([...player.leagues].join(", "))}\n              </div>''',
          '''              <div class="player-leagues">\n                <span class="exposure-copy">${player.count} exposure${player.count === 1 ? "" : "s"}:</span>\n                ${[...player.leagues].map(league => `<span class="league-exposure-label" style="${leagueColorStyle(league)}">${escapeHtml(league)}</span>`).join("")}\n              </div>''',
          'league exposure pills')

          s = replace_once(s,
          '            status: event.status?.type?.shortDetail || "",',
          '''            status: event.status?.type?.shortDetail || "",\n            completed: Boolean(event.status?.type?.completed),\n            statusState: event.status?.type?.state || "",''',
          'completed game state')

          s = replace_once(s,
          '''      const gameStartTime = new Date(game.date).getTime();\n      const isPast = Number.isFinite(gameStartTime) && gameStartTime < Date.now();''',
          '''      const isPast = Boolean(game.completed) || String(game.statusState || "").toLowerCase() === "post";''',
          'completed game gray logic')

          s = replace_once(s,
          '    .game-card.past-game{filter:grayscale(.4);opacity:.76}',
          '    .game-card.past-game{filter:grayscale(.78);opacity:.58}',
          'completed game gray styling')

          s = replace_once(s,
          '''    els.loadBtn.addEventListener("click", loadSleeperData);\n    window.addEventListener("DOMContentLoaded", () => {\n      if (els.username.value.trim()) loadSleeperData();\n    }, { once: true });''',
          '''    els.loadBtn.addEventListener("click", loadSleeperData);\n    const autoLoadSleeperData = () => {\n      if (els.username.value.trim() && !state.loading && !state.user) loadSleeperData();\n    };\n    if (document.readyState === "loading") {\n      window.addEventListener("DOMContentLoaded", autoLoadSleeperData, { once: true });\n    } else {\n      autoLoadSleeperData();\n    }''',
          'reliable auto load')

          s = replace_once(s,
          '        <a class="header-nav" href="./index.html">Owner Dashboard</a>\n        <a class="header-nav gold" id="rankingsLink" href="./team-rankings.html">Team Rankings</a>',
          '        <a class="header-nav" href="./index.html">Owner Dashboard</a>\n        <a class="header-nav" id="crunchtimeLink" href="./crunchtime.html">Crunchtime</a>\n        <a class="header-nav gold" id="rankingsLink" href="./team-rankings.html">Team Rankings</a>',
          'schedule Crunchtime nav')

          s = replace_once(s,
          '''    if (els.rankingsLink) els.rankingsLink.addEventListener("click", () => {''',
          '''    if (els.crunchtimeLink) els.crunchtimeLink.addEventListener("click", () => {\n      const params = new URLSearchParams({\n        username: els.username.value.trim(),\n        season: els.season.value,\n        week: els.week.value\n      });\n      els.crunchtimeLink.href = `./crunchtime.html?${params}`;\n    });\n\n    if (els.rankingsLink) els.rankingsLink.addEventListener("click", () => {''',
          'schedule Crunchtime params')

          schedule_path.write_text(s)

          for filename in ('home.html', 'index.html'):
              p = Path(filename)
              h = p.read_text()
              h = replace_once(h,
              '        <a class="nav-button" id="scheduleLink" href="./schedule-tool.html">Schedule Tool</a>\n        <a class="nav-button gold" id="rankingsLink" href="./team-rankings.html">Team Rankings</a>',
              '        <a class="nav-button" id="scheduleLink" href="./schedule-tool.html">Schedule Tool</a>\n        <a class="nav-button secondary" id="crunchtimeLink" href="./crunchtime.html">Crunchtime</a>\n        <a class="nav-button gold" id="rankingsLink" href="./team-rankings.html">Team Rankings</a>',
              f'{filename} Crunchtime nav')
              h = replace_once(h,
              '        els.scheduleLink.href=`./schedule-tool.html?${params}`;\n        els.rankingsLink.href=`./team-rankings.html?${params}`;',
              '        els.scheduleLink.href=`./schedule-tool.html?${params}`;\n        els.crunchtimeLink.href=`./crunchtime.html?${new URLSearchParams({username,season:String(season),week:String(state.week||1)})}`;\n        els.rankingsLink.href=`./team-rankings.html?${params}`;',
              f'{filename} Crunchtime params')
              p.write_text(h)

          print('Patched schedule-tool.html, home.html, and index.html')
          PY
      - name: Validate changes
        shell: bash
        run: |
          grep -q 'id="crunchtimeLink"' schedule-tool.html
          grep -q 'league-exposure-label' schedule-tool.html
          grep -q 'Boolean(event.status?.type?.completed)' schedule-tool.html
          grep -q 'autoLoadSleeperData' schedule-tool.html
          grep -q 'id="crunchtimeLink"' home.html
          grep -q 'id="crunchtimeLink"' index.html
          test -f crunchtime.html
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add schedule-tool.html home.html index.html
          git commit -m "Add Crunchtime and improve schedule UX"
          git rm .github/workflows/apply-crunchtime-schedule-fixes.yml
          git commit -m "Remove one-time Crunchtime patch workflow"
          git push origin main
