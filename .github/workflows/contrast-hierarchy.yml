name: Contrast hierarchy pass
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contrast-hierarchy.yml'
permissions:
  contents: write
jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply contrast patch
        run: python .github/scripts/contrast_hierarchy.py
      - name: Validate contrast changes
        run: |
          grep -q 'contrast-hierarchy-v2' app-shell.css
          grep -q 'window-ranked-game${recommendedGame' schedule-tool.html
          git diff --check
      - name: Validate Schedule JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('schedule-tool.html','utf8');
          const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi;
          let m, i=0;
          while ((m = re.exec(html))) { i++; new vm.Script(m[1], {filename:`schedule-tool:inline-${i}`}); }
          console.log('schedule inline scripts parse');
          NODE
      - name: Commit contrast pass
        run: |
          rm -f .github/scripts/contrast_hierarchy.py .github/workflows/contrast-hierarchy.yml
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restore visual hierarchy and contrast"
          git push
