name: Apply opponents and glass v3
on:
  push:
    paths:
      - '.github/workflows/apply-opponents-glass-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply opponent and glass patch
        run: python tools/apply-opponents-glass-v3.py
      - name: Validate behavior and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          schedule = Path('schedule-tool.html').read_text()
          css = Path('app-shell.css').read_text()
          assert 'rosters: item.rosters || []' in schedule
          assert 'resolvedOpponentStarters' in schedule
          assert 'resolvedOpponentPlayers' in schedule
          assert 'live.opponentRosterId === null || live.opponentRosterId === undefined' in schedule
          assert 'selectedLeagueIds.has(String(item.leagueId))' in schedule
          assert 'selectedLeagueIds.has(String(exposure.leagueId))' in schedule
          assert 'function scheduleOpponentPlayerMarkup' in schedule
          opponent_body = schedule.split('function scheduleOpponentPlayerMarkup',1)[1].split('\n    }',1)[0]
          assert 'impact-lines' not in opponent_body
          own_body = schedule.split('function scheduleImpactPlayerMarkup',1)[1].split('\n    }',1)[0]
          assert 'impact-lines' in own_body and 'impact-help' in own_body and 'impact-hurt' in own_body
          assert '/* glass-polish-v3 */' in css
          assert '--app-glass:rgba(255,255,255,.62)' in css
          assert 'rgba(255,255,255,.88)' in css
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', schedule, re.S)
          for i, body in enumerate(scripts):
              Path(f'/tmp/schedule-inline-{i}.js').write_text(body)
          print(f'validated markers; wrote {len(scripts)} inline scripts')
          PY
          for f in /tmp/schedule-inline-*.js; do node --check "$f"; done
      - name: Commit changes
        run: |
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add schedule-tool.html app-shell.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix opponent players and deepen glass UI"
          git push
