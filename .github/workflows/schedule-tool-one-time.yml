name: Apply schedule tool fixes

on:
  push:
    paths:
      - '.github/workflows/schedule-tool-one-time.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply schedule tool UI fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch schedule tool
        shell: python
        run: |
          from pathlib import Path

          path = Path('schedule-tool.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.player-leagues{color:var(--muted);font-size:.77rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
                  '.player-leagues{color:var(--muted);font-size:.77rem;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.35}'
              ),
              (
                  '    .game-main{\n      display:grid;grid-template-columns:minmax(180px,1fr) 100px minmax(180px,1fr) 120px;',
                  '    .game-card.past-game{filter:grayscale(.4);opacity:.76}\n    .game-main{\n      display:grid;grid-template-columns:minmax(180px,1fr) 100px minmax(180px,1fr) 120px;'
              ),
              (
                  '      const homeLogo = game.home.logo\n        ? `<img class="team-logo" src="${escapeHtml(game.home.logo)}" alt="" />`\n        : "";\n\n      return `\n        <article class="game-card">',
                  '      const homeLogo = game.home.logo\n        ? `<img class="team-logo" src="${escapeHtml(game.home.logo)}" alt="" />`\n        : "";\n      const gameStartTime = new Date(game.date).getTime();\n      const isPast = Number.isFinite(gameStartTime) && gameStartTime < Date.now();\n\n      return `\n        <article class="game-card ${isPast ? "past-game" : ""}">'
              ),
              (
                  '    els.loadBtn.addEventListener("click", loadSleeperData);\n    els.week.addEventListener("change", loadWeek);',
                  '    els.loadBtn.addEventListener("click", loadSleeperData);\n    window.addEventListener("DOMContentLoaded", () => {\n      if (els.username.value.trim()) loadSleeperData();\n    }, { once: true });\n    els.week.addEventListener("change", loadWeek);'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one match, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/schedule-tool-one-time.yml').unlink()

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply schedule tool UI fixes"
          git push
