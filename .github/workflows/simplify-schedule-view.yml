name: Simplify schedule view
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-schedule-view.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply simplification patch
        run: python .github/scripts/simplify_schedule.py
      - name: Validate schedule tool
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('schedule-tool.html').read_text()
          for needle in ['schedule-focus-v3','account-settings','Leagues & priorities','Live league scores','game-detail-summary','What to watch · Week']:
              assert needle in s, needle
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('schedule-tool.html','utf8');
          const blocks=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          for(const code of blocks)new vm.Script(code);
          console.log(`Validated ${blocks.length} script blocks`);
          NODE
      - name: Commit simplified schedule
        run: |
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add schedule-tool.html
          git commit -m "Simplify schedule tool viewing experience"
          git push
          git rm .github/workflows/simplify-schedule-view.yml .github/scripts/simplify_schedule.py
          git commit -m "Remove one-time schedule simplification files"
          git push
