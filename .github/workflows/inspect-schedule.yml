name: Inspect schedule tool

on:
  push:
    paths:
      - '.github/workflows/inspect-schedule.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print targeted schedule code
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('schedule-tool.html').read_text(encoding='utf-8')
          lines = text.splitlines()

          def around(label, pattern, before=15, after=90, flags=0):
              print(f'\n===== {label} =====')
              m = re.search(pattern, text, flags)
              if not m:
                  print('NOT FOUND')
                  return
              line = text[:m.start()].count('\n')
              start = max(0, line-before)
              end = min(len(lines), line+after)
              for i in range(start, end):
                  print(f'{i+1:05d}: {lines[i]}')

          around('renderPlayersForGame', r'function\s+renderPlayersForGame\b', 10, 130)
          around('groupPlayerExposures', r'function\s+groupPlayerExposures\b', 10, 130)
          around('playerCardMarkup', r'function\s+playerCardMarkup\b', 10, 150)
          around('starterGroups first assignment', r'starterGroups\s*[:=]', 25, 160)
          around('selected roster first occurrence', r'selectedRoster', 25, 160, re.I)
          around('Sleeper matchup endpoint', r'/matchups/', 25, 160)
          around('matchup_id first occurrence', r'matchup_id', 25, 160)
          around('roster_positions first occurrence', r'roster_positions', 25, 160)
          around('best ball first occurrence', r'best[ _-]?ball', 25, 160, re.I)

          print('\n===== MATCHING LINES =====')
          needles = ['starterGroups', 'rosterData', 'selectedRoster', 'matchup_id', 'matchups', 'roster_positions', 'best_ball', 'best ball', 'Best Ball']
          for i, line in enumerate(lines, 1):
              low = line.lower()
              if any(n.lower() in low for n in needles):
                  print(f'{i:05d}: {line}')
