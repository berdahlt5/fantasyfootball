name: Inspect schedule tool

on:
  push:
    paths:
      - '.github/workflows/inspect-schedule.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print targeted schedule code
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('schedule-tool.html').read_text(encoding='utf-8')
          lines = text.splitlines()

          def around(label, pattern, before=20, after=140, flags=0):
              print(f'\n===== {label} =====')
              m = re.search(pattern, text, flags)
              if not m:
                  print('NOT FOUND')
                  return
              line = text[:m.start()].count('\n')
              for i in range(max(0, line-before), min(len(lines), line+after)):
                  print(f'{i+1:05d}: {lines[i]}')

          around('myRosterId first occurrence', r'myRosterId', 30, 220)
          around('exposures push first occurrence', r'exposures\.push', 40, 240)
          around('bucket starter first occurrence', r'bucket:\s*["\']starter', 40, 240)
          around('players roster reference', r'\.players\b', 40, 220)
          around('starters roster reference', r'\.starters\b', 40, 220)
          around('load leagues function', r'async function\s+load[^\n]*(?:League|league)', 20, 260)
          around('render all', r'function\s+renderAll\b', 30, 220)
          around('build games', r'function\s+build[^\n]*(?:Game|game)', 30, 260)
          around('league users', r'/users', 40, 220)
          around('league rosters', r'/rosters', 40, 240)

          print('\n===== MATCHING LINES =====')
          needles = ['myRosterId', 'exposures.push', '.players', '.starters', 'bucket:', 'rosterMeta', '/rosters', '/users', 'state.exposures']
          for i, line in enumerate(lines, 1):
              low = line.lower()
              if any(n.lower() in low for n in needles):
                  print(f'{i:05d}: {line}')
