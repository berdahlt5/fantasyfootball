name: Apply inspiration UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-inspo-ui.yml'

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply inspiration styling
        run: python .github/scripts/apply_inspo_ui.py
      - name: Validate styling
        run: |
          grep -q 'inspo-ui-v1' app-shell.css
          grep -q 'window-ranked-game.recommended>.watch-card' app-shell.css
          grep -q 'background:var(--app-gradient)!important' app-shell.css
          grep -q 'app-nav-link.active' app-shell.css
          git diff --check
      - name: Commit styling
        run: |
          rm -f .github/scripts/apply_inspo_ui.py .github/workflows/apply-inspo-ui.yml
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bring app UI closer to blue gradient inspiration"
          git push
