name: Apply mobile nav v8
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-nav-v8.yml'
      - 'scripts/apply-mobile-nav-v8.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile navigation fix
        run: python scripts/apply-mobile-nav-v8.py
      - name: Validate mobile navigation CSS
        run: |
          grep -q 'mobile-nav-v8' app-shell.css
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' app-shell.css
          grep -q 'bottom:calc(10px + env(safe-area-inset-bottom))' app-shell.css
      - name: Commit changes and remove one-time patch files
        run: |
          rm -f scripts/apply-mobile-nav-v8.py .github/workflows/apply-mobile-nav-v8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep More and Settings visible on mobile'
          git push
