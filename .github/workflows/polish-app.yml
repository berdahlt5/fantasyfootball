name: Polish fantasy app UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-app.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish patch
        run: python .github/scripts/polish_app.py
      - name: Validate shared shell
        run: |
          node --check app-shell.js
          git diff --check
          grep -q 'fantasyWatchGameCount' app-shell.js
          grep -q 'Favorite NFL team' app-shell.js
          grep -q 'scheduleWatchCount' schedule-tool.html
          grep -q 'best-ball leagues are intentionally excluded' lineup-assistant.html
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const files = ['index.html','home.html','schedule-tool.html','lineup-assistant.html','crunchtime.html','team-rankings.html','waiver-wire-agent.html'];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi;
            let match, index = 0;
            while ((match = re.exec(html))) {
              index += 1;
              try { new vm.Script(match[1], { filename: `${file}:inline-${index}` }); }
              catch (err) { console.error(err); process.exit(1); }
            }
          }
          console.log('inline scripts parse');
          NODE
      - name: Commit polished app
        run: |
          rm -f .github/scripts/polish_app.py .github/workflows/polish-app.yml
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Polish app UI, settings, and watch recommendations"
          git push
