name: Apply watch windows v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-windows-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch watch windows v2
        run: python tmp/apply-watch-windows-v2.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('schedule-tool.html').read_text()
          for n in ['watch-windows-v2','watch-window-mode','Full NFL slate grouped chronologically','mySpecial.length * 0.35','Sunday · 1:00 PM window','Sunday · 4:00 PM window']:
              assert n in s,n
          assert 'gameRows.filter(game => !game.completed' not in s
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('schedule-tool.html','utf8');
          for (const m of html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)) new vm.Script(m[1]);
          console.log('JS validated');
          NODE
      - name: Commit changes
        run: |
          git config user.name "berdahlt5"
          git config user.email "berdahlt5@gmail.com"
          git add schedule-tool.html
          git commit -m "Show full slate by kickoff window"
          git push
          git rm .github/workflows/apply-watch-windows-v2.yml tmp/apply-watch-windows-v2.py
          git commit -m "Remove one-time watch-window v2 patch files"
          git push
