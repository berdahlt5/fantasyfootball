name: Apply UI title capitalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-titlecase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply title capitalization
        run: python .github/scripts/titlecase_patch.py
      - name: Validate shared shell JavaScript
        run: node --check app-shell.js
      - name: Commit changes and clean up patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home.html schedule-tool.html team-rankings.html waiver-wire-agent.html lineup-assistant.html crunchtime.html app-shell.js
          git rm -f .github/scripts/titlecase_patch.py .github/workflows/apply-titlecase.yml
          git commit -m "Standardize UI title capitalization"
          git push
